name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Expanded as environment variables rather than pasted into the script. A tag name
      # is attacker-chosen input once anyone has push access, and ${{ }} substitution
      # happens before the shell ever sees the line.
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: echo "name=${INPUT_TAG:-$REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          swift build -c release
          make test

      - name: Package
        # Stamp the tag into the bundle so the app cannot report a different version
        # from the release it was published under.
        run: make dist VERSION="${TAG#v}"
        env:
          TAG: ${{ steps.tag.outputs.name }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          CHECKSUM=$(shasum -a 256 build/AudioAdjuster-macos.zip | cut -d' ' -f1)
          cat > notes.md <<NOTES
          ## Install

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh
          \`\`\`

          Or download \`AudioAdjuster-macos.zip\` below and move the app to /Applications.

          Requires macOS 14.2 or later. On first use the app asks for audio-recording
          permission — Core Audio process taps are gated behind it, and without it a tap
          returns silence rather than an error.

          The build is ad-hoc signed, not notarized, because the project has no Apple
          Developer ID. Installed with the command above it opens normally, since files
          fetched by curl are not quarantined. If you download the zip below through a
          browser it is quarantined instead, and macOS will refuse a double-click — open
          it the first time with right-click > Open.

          \`\`\`
          SHA-256  ${CHECKSUM}
          \`\`\`
          NOTES
          gh release create "$TAG" \
            build/AudioAdjuster-macos.zip \
            --title "Audio Adjuster $TAG" \
            --notes-file notes.md
