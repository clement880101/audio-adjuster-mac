name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Stated rather than inherited: the repository default is read today, but a default is
# not a guarantee, and this job only ever needs to read the tree.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Core Audio process taps need macOS 14.2 or later, both to build and to run.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      # -warnings-as-errors is set here rather than in the Makefile so local builds stay
      # permissive while you work, and nothing reaches main with a new warning. Two
      # UnsafeMutableRawPointer warnings sat in CoreAudioSystem.swift for exactly this
      # reason: they were visible in every log and blocked nothing.
      - name: Build
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Test
        run: make test

      - name: Assemble app bundle
        run: make dist

      # Proves the bundle is well formed before anyone downloads it: a missing
      # Info.plist or a broken signature only shows up at launch otherwise.
      - name: Verify bundle
        run: |
          set -euo pipefail
          plutil -lint build/AudioAdjuster.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 build/AudioAdjuster.app
          test -x build/AudioAdjuster.app/Contents/MacOS/AudioAdjuster

          # The icon and the menu bar glyph are generated rather than committed, so a
          # broken `make icon` would otherwise ship a bundle with no artwork in it and
          # only show up on someone's screen.
          for resource in \
            AudioAdjuster.icns \
            MenuBarGlyphTemplate.png \
            MenuBarGlyphTemplate@2x.png
          do
            path="build/AudioAdjuster.app/Contents/Resources/$resource"
            test -s "$path" || { echo "::error::missing or empty: $resource"; exit 1; }
          done
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" \
            build/AudioAdjuster.app/Contents/Info.plist

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: AudioAdjuster-macos
          path: build/AudioAdjuster-macos.zip
          if-no-files-found: error
